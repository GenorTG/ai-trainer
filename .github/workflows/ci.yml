# GitHub Actions CI for AI Trainer
# Runs on push to main and pull requests.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # LINT JOB
  # ===========================================================================
  lint:
    name: Lint (ruff + bandit + pydocstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pydocstyle

      - name: Ruff check
        run: ruff check trainer/ server/

      - name: Ruff format check
        run: ruff format --check trainer/ server/

      - name: Bandit security check
        run: bandit -r trainer/ server/ -ll --skip B101,B307,B104,B615,B314,B324,B701

      - name: pydocstyle
        run: pydocstyle trainer/ server/ --convention=google || true  # warnings only

  # ===========================================================================
  # TYPE CHECK JOB — mypy only, no heavy deps
  # ===========================================================================
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic

      - name: mypy trainer
        run: mypy trainer/src --ignore-missing-imports --no-strict-optional

      - name: mypy server
        run: mypy server/inference_server --ignore-missing-imports --no-strict-optional

  # ===========================================================================
  # TEST JOB — fast CPU-only unit tests
  # ===========================================================================
  test-unit:
    name: Unit Tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./trainer --no-deps
          pip install -e ./server --no-deps
          pip install pytest pytest-asyncio pytest-mock pytest-cov
          pip install pydantic rich fastapi jinja2 pyyaml requests httpx

      - name: Run fast unit tests
        run: python -m pytest tests/unit -m "not slow" -v --tb=short

  # ===========================================================================
  # TEST JOB — full suite with coverage (installs everything)
  # ===========================================================================
  test-full:
    name: All Tests + Coverage
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./trainer
          pip install -e ./server
          pip install -e ./tests 2>/dev/null || true
          pip install pytest pytest-asyncio pytest-mock pytest-cov

      - name: Run all tests with coverage
        run: pytest tests/unit tests/api tests/frontend --cov=finetune_studio --cov=inference_server --cov-report=html:tests/coverage_html --cov-report=term -q --tb=short -m "not slow"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/coverage_html/
          retention-days: 30

  # ===========================================================================
  # BUILD JOB — Docker images
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-full
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build inference server image
        run: docker build -t ai-trainer/server:${{ github.sha }} ./server

      - name: Tag latest
        run: docker tag ai-trainer/server:${{ github.sha }} ai-trainer/server:latest

  # ===========================================================================
  # ALL CHECKS COMPLETE
  # ===========================================================================
  all-green:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit, test-full]
    if: success()
    steps:
      - run: echo "✅ All checks passed!"
