version: "3.8"

services:
  inference-server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./rag_data:/app/rag_data
      - ./config.yaml:/app/config.yaml
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
