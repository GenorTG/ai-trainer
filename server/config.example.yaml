server:
  host: "0.0.0.0"
  port: 8080

model:
  path: "./models/model.gguf"  # Path to GGUF or safetensors directory
  n_gpu_layers: 99
  n_ctx: 8192

rag:
  enabled: true
  store_path: "./rag_data/store"
  documents_path: "./rag_data/documents"
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 512
  chunk_overlap: 50
  top_k: 5
  min_score: 0.3
  max_context_length: 2000

inference:
  max_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  repeat_penalty: 1.05

api:
  key: ""  # Leave empty for no auth
  cors: true
