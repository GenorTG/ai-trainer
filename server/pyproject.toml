[project]
name = "inference-server"
version = "0.2.0"
description = "Portable Inference Server with RAG"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",
    "striprtf>=0.0.26",
    "xlrd>=2.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "llama-cpp-python>=0.3.0",
]
transformers = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
]
all = [
    "inference-server[gpu,transformers]",
]

[project.scripts]
inference-server = "inference_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference_server"]
