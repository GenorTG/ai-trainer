# AI Trainer — Project-level configuration
# Per-tool configs are merged into trainer/pyproject.toml and server/pyproject.toml
# but this file defines the shared standards.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "models",
    "data",
    "unsloth_compiled_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
# Standard rule sets (matches previous lint-clean state)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

# Allow common false positives
ignore = [
    "E501",     # line too long (handled by formatter)
    "E701",     # multiple statements on one line (try: x = ...)
    "B008",     # do not perform function calls in argument defaults
    "B904",     # raise from (we use bare raise)
    "B007",     # loop variable not used (we use _ intentionally)
    "B905",     # zip() without strict= (Python 3.10 compat)
    "SIM105",   # try-except-pass can use contextlib.suppress (stylistic)
    "SIM108",   # use ternary instead of binary if
    "UP007",    # use X | Y for UnionType (we use Optional still)
    "UP006",    # use lowercase type hints (Optional[X] still)
    "RUF100",   # unused noqa (kept for documentation)
    "RUF005",   # iterable unpacking instead of concatenation (stylistic)
    "E402",     # module level import not at top (intentional in some files)
    "E741",     # ambiguous variable name (l, I, O — stylistic)
    "BLE001",   # blind-except (we catch generic Exception intentionally)
    "RUF059",   # unpacked variable never used (unpacking API result tuples)
]

[tool.ruff.lint.per-file-ignores]
# Tests can use longer lines, unused imports, etc.
"tests/*" = [
    "PLR2004",  # magic values OK in tests
    "N802",     # function name should be lowercase (test_* methods)
    "N806",     # variable in function should be lowercase
    "ARG",      # unused arguments (fixtures)
    "PT009",    # use a regular assert instead of unittest-style
    "PT027",    # pytest.raises without match
]
"**/__init__.py" = ["F401"]  # unused imports OK in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["finetune_studio", "inference_server"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
show_error_codes = true
exclude = [
    "models",
    "data",
    "tests/",
    "unsloth_compiled_cache",
    ".venv",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["finetune_studio.benchmarks.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# numpy 2.4+ uses Python 3.12 Type statement syntax;
# ignore errors from numpy stubs when running on 3.10/3.11.
module = ["numpy.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",              # show summary of all test results
    "--strict-markers", # fail on unknown markers
    "--strict-config",  # fail on invalid config
    "--tb=short",       # short traceback format
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: unit test (fast, no I/O)",
    "integration: integration test (multiple components)",
    "api: HTTP / FastAPI endpoint test",
    "frontend: HTML / JS / browser test",
    "slow: slow test (model loading, GPU) — excluded from --fast runs",
]
filterwarnings = [
    "error",                          # treat warnings as errors
    "ignore::DeprecationWarning",     # but allow deprecation warnings
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnknownMarkWarning",  # allow custom markers
    "ignore::DeprecationWarning:starlette.*",     # starlette deprecation OK
    "ignore::DeprecationWarning:jinja2.*",        # jinja2 deprecation OK
    "ignore::starlette.exceptions.StarletteDeprecationWarning",  # httpx vs httpx2
    "ignore::pytest.PytestUnraisableExceptionWarning",  # httpx/anyio async cleanup
    "ignore::RuntimeWarning",         # coroutine cleanup warnings from httpx
]

[tool.coverage.run]
branch = true
source = ["trainer", "server"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "models/*",
    "data/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "raise ImportError",
    "except ImportError",
]
precision = 1
show_missing = true
skip_covered = false